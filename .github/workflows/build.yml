name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      # Rolling "latest" release so the APK is a plain download link on the phone.
      - run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/outputs/apk/debug/*.apk --prerelease --title "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
